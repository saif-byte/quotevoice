# Free Supabase projects pause after 7 days without database activity, and resuming is manual.
# This calls a tiny database function once a day so the project always counts as active.
# (GitHub turns off scheduled workflows after 60 days with no commits; any push turns it back on.)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *' # every day, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the ping function
        env:
          # Publishable key: safe to be public, limited by row-level security.
          SUPABASE_URL: https://vmyxhleijilablgbdvny.supabase.co
          SUPABASE_KEY: sb_publishable_4LlUIOVov6QYfQMlMXiVvQ_W1vz50M3
        run: |
          status=$(curl -s -o response.txt -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat response.txt)"
          test "$status" = "200"
